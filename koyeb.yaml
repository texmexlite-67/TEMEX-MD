name: texmex-md
services:
  - name: texmex-md-bot
    type: web
    docker:
      dockerfile: Dockerfile
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    health_checks:
      - http:
          port: 3000
          path: /health
    env:
      - key: BOT_NAME
        value: TEXMEX-MD
      - key: OWNER_NAME
        value: TEXMEX-MD
      - key: PORT
        value: "3000"
      - key: MODE
        value: public
      - key: PREFIX
        value: "."
