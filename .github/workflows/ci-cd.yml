name: TEXMEX-MD CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify-and-test:
    name: Verify & Self-Test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Environment Doctor
        run: npm run doctor

      - name: Run Automated Verification Suite
        run: npm test

  continuous-deployment:
    name: Docker Build & Cloud CD Trigger
    needs: verify-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Universal TEXMEX-MD Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/texmexlite-67/temex-md:latest
            ghcr.io/texmexlite-67/temex-md:${{ github.sha }}

      - name: Trigger Cloud Deploy Hook (Render / Koyeb / Railway)
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        env:
          HOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: curl -fsSL -X POST "$HOOK_URL"
